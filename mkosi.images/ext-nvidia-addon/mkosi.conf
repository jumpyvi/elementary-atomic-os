#nvidia-addon
[Config]
Dependencies=base
ImageId=ext-nvidia-addon

[Output]
Format=addon
Overlay=yes
Output=ext-nvidia-addon-%a_%v
OutputExtension=addon.efi
CompressOutput=zstd

[Validation]
Verity=no

[Content]
BaseTrees=%O/base_%v
Overlay=yes
Packages=systemd-boot-efi
KernelCommandLine=nvidia-drm.modeset=1 module_blacklist=nouveau