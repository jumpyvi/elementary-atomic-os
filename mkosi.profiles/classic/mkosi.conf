[Match]
Profiles=classic

[Output]
Format=directory
ElTorito=yes
SplitArtifacts=kernel,initrd
OutputDirectory=../../mkosi.output/classic
ImageId=elementaryclassic

[Content]
Bootable=yes
Packages=
    grub-efi-amd64
    grub-efi-amd64-signed
    mokutil
    shim-signed
    e2fsprogs
    dosfstools
    grub-pc-bin
    casper
    initramfs-tools
Bootloader=grub
KernelInitrdModules=
    default
    ahci
    nvme
    xhci_pci
    usb_storage
    uas
    sd_mod
    sr_mod
    isofs
    loop
    ext4
KernelCommandLine=
    rw
    console=ttyS0
    boot=casper

[Validation]
SecureBoot=no
SignExpectedPcr=no