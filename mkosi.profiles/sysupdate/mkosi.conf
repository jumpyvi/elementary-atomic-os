# THIS PROFILE SHOULD NOT BE USED BY DEFAULT
# This is an implementation of sysupdate-based Ubuntu, everything that would be necessary to implement the same idea as systemd's particleOS.

[Match]
Profiles=sysupdate

[Output]
SplitArtifacts=uki,partitions
Format=disk

[Content]
Bootable=yes
Bootloader=uki
UnifiedKernelImageFormat=%i_%v_%a
InitrdProfiles=
KernelInitrdModules=
    default
    ahci
    nvme
    xhci_pci
    usb_storage
    uas
    sd_mod
    dm-verity
KernelCommandLine=
    splash
    root=dissect
    mount.usr=dissect
    rw
    audit=0
    systemd.firstboot=no
    systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:home=unprotected+absent:=ignore
    systemd.image_filter=usr=Elementary_*:usr-verity=Elementary_*:usr-verity-sig=Elementary_*:root=Elementary-*:home=Elementary-*
    systemd.debug-shell=ttyS0
    rd.systemd.debug-shell=ttyS0
    ipe.enforce=0

[Validation]
# just for now, please do enable secureboot
SecureBoot=no
SignExpectedPcr=no

# mkosi vm specific
[Runtime]
RuntimeSize=40G
RAM=4G
CPUs=4
Ephemeral=yes
Credentials=
    passwd.plaintext-password.root=particleos
    tty.serial.hvc0.agetty.autologin=particleos
    tty.serial.hvc0.login.noauth=yes
    tty.console.agetty.autologin=particleos
    tty.console.login.noauth=yes
    tty.virtual.tty1.agetty.autologin=particleos
    tty.virtual.tty1.login.noauth=yes
