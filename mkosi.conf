[Config]
MinimumVersion=26~devel

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,universe

[Content]
Hostname=elementary

[Build]
ToolsTree=default
History=yes
CacheDirectory=mkosi.cache
Incremental=yes

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Output]
ImageId=Elementary
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%v_%a # Versioned tag for releases